name: Build Coder AGPL image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream Coder release to build (without the v prefix)
        required: true
        default: "2.34.10"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit

      - name: Checkout v${{ inputs.version }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          use-cache: false

      - name: Build AGPL binaries
        env:
          CODER_BUILD_AGPL: "1"
          CODER_RELEASE: "true"
        run: |
          set -euxo pipefail
          make gen/mark-fresh
          make -j build/coder_linux_{amd64,arm64}

      - name: Build and smoke-test images
        env:
          # Same base-image reference upstream's release workflow derives with
          # CODER_IMAGE_BASE=ghcr.io/coder/coder-base ./scripts/image_tag.sh,
          # so this build tracks the release instead of a hand-pinned digest.
          CODER_BASE_IMAGE_TAG: ghcr.io/coder/coder-base:v${{ inputs.version }}
        run: |
          set -euxo pipefail
          version="${{ inputs.version }}"
          image_base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coder"
          amd64_image="$image_base:v${version}-agpl-amd64"
          arm64_image="$image_base:v${version}-agpl-arm64"

          ./scripts/build_docker.sh \
            --arch amd64 \
            --version "$version" \
            --target "$amd64_image" \
            build/coder_linux_amd64
          ./scripts/build_docker.sh \
            --arch arm64 \
            --version "$version" \
            --target "$arm64_image" \
            build/coder_linux_arm64

          docker run --rm --entrypoint /opt/coder "$amd64_image" version | tee build/agpl-version.txt
          docker run --rm --entrypoint /opt/coder "ghcr.io/coder/coder:v${version}" version | tee build/upstream-version.txt
          grep -q "^Coder (AGPL) v${version}" build/agpl-version.txt
          for command in server create start stop ssh templates task; do
            docker run --rm --entrypoint /opt/coder "$amd64_image" "$command" --help >/dev/null
          done
          docker run --rm --entrypoint /opt/coder "$amd64_image" --help > build/agpl-help.txt
          docker run --rm --entrypoint /opt/coder "ghcr.io/coder/coder:v${version}" --help > build/upstream-help.txt
          diff -u build/upstream-help.txt build/agpl-help.txt > build/help.diff || true

          docker push "$amd64_image"
          docker push "$arm64_image"
          ./scripts/build_docker_multiarch.sh \
            --push \
            --version "$version" \
            --target "$image_base:v${version}-agpl" \
            "$amd64_image" "$arm64_image"

          {
            echo '### Runtime comparison'
            echo
            echo '```text'
            cat build/upstream-version.txt
            cat build/agpl-version.txt
            echo '```'
            echo
            echo '### Root command help diff'
            echo
            echo '```diff'
            head -n 200 build/help.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coder-v${{ inputs.version }}-runtime-comparison
          retention-days: 7
          path: |
            build/agpl-version.txt
            build/upstream-version.txt
            build/agpl-help.txt
            build/upstream-help.txt
            build/help.diff
